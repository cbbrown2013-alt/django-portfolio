{% extends "portfolio_app/base_template.html" %} {% block content %}

<h2>Active Student Portfolios</h2>

<ul>
  {% for portfolio in active_portfolios %}
  <li>
    <a href="{% url 'portfolio-detail' portfolio.pk %}">
      {{ portfolio.title }}
    </a>
  </li>
  {% empty %}
  <li>No active portfolios found.</li>
  {% endfor %}
</ul>

{% endblock %}
